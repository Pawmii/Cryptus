[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptus"
version = "1.0.0"
description = "CRYPTUS — self-hosted, non-custodial cryptocurrency payment gateway"
readme = "../README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "argon2-cffi>=23.1",
  "pyotp>=2.9",
  "cryptography>=42",
  "embit>=0.8",
  "eth-account>=0.13",
  "pytoniq-core>=0.1.40",
  "pynacl>=1.5",
  "segno>=1.6",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
kms = ["boto3>=1.34"]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
cryptus = "cryptus.cli:main"
cryptus-signer = "cryptus_signer.cli:main"

[tool.setuptools.packages.find]
include = ["cryptus*", "cryptus_signer*"]

[tool.setuptools.package-data]
cryptus = ["migrations/*.ini", "migrations/*.py", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
