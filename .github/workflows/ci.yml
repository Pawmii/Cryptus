name: CI

on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: ci, POSTGRES_DB: cryptus }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - run: pip install -e "backend[dev]"
      - name: Tests (SQLite)
        working-directory: backend
        run: pytest -q
      - name: Migrations apply on PostgreSQL
        working-directory: backend
        env:
          CRYPTUS_ENV: test
          CRYPTUS_SECRET_KEY: ci-secret-key-0123456789-abcdefghijklmnop
          CRYPTUS_DATABASE_URL: postgresql+psycopg://postgres:ci@localhost:5432/cryptus
        run: cryptus migrate

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  image:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cryptus:ci .
